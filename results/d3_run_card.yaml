ablation_interpretation: "On this 18-item gold set, vector_only and hybrid both reach\
  \ Recall@5=1.00, while graph_guided alone reaches only 0.06 \u2014 this is expected,\
  \ not a defect: select_subgraph deliberately returns graph *neighbors* of the vector-seeded\
  \ papers, never the seeds themselves, so when (as here) the correct answer is the\
  \ directly-matching paper, only modes that include the vector seed can find it.\
  \ Reranking lifts Recall@5 from 0.44 (hybrid, no rerank) to 1.00 (hybrid+rerank)\
  \ at a latency cost of 3566ms p95 \u2014 consistent with D2's own finding that the\
  \ cross-encoder rerank is the single biggest quality lever in the pipeline; faithfulness\
  \ stays flat (0.33 -> 0.33) because it's measured against whichever single excerpt\
  \ the extractive stub picks, which reranking doesn't materially change here even\
  \ when it changes *which paper* that excerpt comes from. Honest limitation: graph_guided's\
  \ weakness here is partly an artifact of this corpus's graph signal being thin \u2014\
  \ CITES is 300 synthetic edges (co-author-or-same-venue heuristic, not real citations;\
  \ the 144 papers don't actually cite each other) and Topic coverage is dominated\
  \ by a single arXiv category (cs.IR, 96% of papers) \u2014 so graph expansion has\
  \ less genuine relational signal to work with than a citation-rich corpus would\
  \ provide."
ablation_limitations:
- "CITES is 300 synthetic edges (co-author-or-same-venue + 1-year-window heuristic),\
  \ not real citations \u2014 the 144 papers in this corpus do not actually cite each\
  \ other."
- Topic nodes are just the 5 arXiv categories and cs.IR alone covers 138/144 papers
  (96%), so shared-topic alone is a weak/non-discriminating graph signal at this corpus
  size.
- "Faithfulness/relevance reflect the extractive answer() stand-in, not the brief's\
  \ Qwen2.5-1.5B-Instruct generator (not yet wired up \u2014 needs CUDA torch + bitsandbytes)."
- graph_guided structurally excludes vector-seeded papers from its results (returns
  neighbors, not seeds), so it is expected to underperform on gold questions whose
  answer is the directly-matching paper rather than a related one.
